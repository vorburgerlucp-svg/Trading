<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemeinsame Ausgaben</title>
<style>
  :root{
    --bg:#f2efe6;
    --card:#ffffff;
    --line:#e2ddd0;
    --ink:#1f1c16;
    --muted:#8a8477;
    --accent:#b5542f;
    --accent-soft:#f4e2d8;
    --ok:#3f6b4e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:24px 16px 60px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  h1{font-size:26px;font-weight:700;margin:0 0 20px;letter-spacing:-0.02em;}
  .status{
    font-size:13px;color:var(--muted);margin-bottom:16px;
    display:flex;align-items:center;gap:6px;min-height:18px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;}
  .dot.err{background:var(--accent);}
  .row{display:flex;gap:10px;margin-bottom:10px;}
  select,input,button{
    font-family:inherit;font-size:15px;
    border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;background:var(--card);color:var(--ink);
  }
  select:focus,input:focus{outline:none;border-color:var(--accent);}
  .full{width:100%;}
  .row > *{flex:1;min-width:0;}
  .addbtn{
    background:var(--accent);color:#fff;border:none;font-weight:600;
    cursor:pointer;transition:opacity .15s;
  }
  .addbtn:hover{opacity:.9;}
  .addbtn:disabled{opacity:.5;cursor:default;}
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-bottom:12px;
  }
  .card .label{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .card .amount{font-size:28px;font-weight:700;}
  .ausgleich .amount{color:var(--accent);}
  .list{margin-top:22px;}
  .entry{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px;
  }
  .entry:last-child{border-bottom:none;}
  .entry .desc{font-weight:600;}
  .entry .meta{color:var(--muted);font-size:12px;}
  .entry .amt{white-space:nowrap;font-weight:600;}
  .entry .del{
    border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:16px;padding:2px 6px;
  }
  .entry .del:hover{color:var(--accent);}
  .reset{
    width:100%;margin-top:20px;background:var(--card);cursor:pointer;
  }
  .reset:hover{background:var(--accent-soft);border-color:var(--accent);}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gemeinsame Ausgaben</h1>
  <div class="status" id="status"><span class="dot" id="statusDot"></span><span id="statusText">Lädt…</span></div>

  <div class="row">
    <select id="monthSelect"></select>
    <button id="newMonthBtn" style="flex:0 0 auto;">+ Neuer Monat</button>
  </div>

  <input class="full" id="descInput" placeholder="Wofür? (z.B. Einkauf)" style="margin-bottom:10px;">

  <div class="row">
    <input type="date" id="dateInput">
    <input type="number" id="amountInput" placeholder="Betrag €" step="0.01">
    <select id="personInput">
      <option value="Vorburger">Vorburger</option>
      <option value="Ilic">Ilic</option>
    </select>
  </div>
  <button class="addbtn full" id="addBtn" style="margin-bottom:20px;">Hinzufügen</button>

  <div class="card">
    <div class="label">Vorburger bezahlt</div>
    <div class="amount" id="sumVorburger">0,00 €</div>
  </div>
  <div class="card">
    <div class="label">Ilic bezahlt</div>
    <div class="amount" id="sumIlic">0,00 €</div>
  </div>
  <div class="card ausgleich">
    <div class="label">Ausgleich</div>
    <div class="amount" id="ausgleich">–</div>
  </div>

  <button class="reset full" id="resetBtn">Diesen Monat zurücksetzen</button>

  <div class="list" id="list"></div>
</div>

<script>
const monthSelect = document.getElementById('monthSelect');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const dateInput = document.getElementById('dateInput');

let months = [];
let currentMonth = null;
let entries = [];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return d.slice(0,7); } // YYYY-MM
function monthLabel(k){
  const [y,m] = k.split('-');
  const names = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  return names[parseInt(m,10)-1] + ' ' + y;
}
function fmt(n){ return n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function setStatus(ok, msg){
  statusDot.className = 'dot' + (ok?'':' err');
  statusText.textContent = msg;
}

const DB_URL = 'https://finanzen-7dfd4-default-rtdb.europe-west1.firebasedatabase.app';

async function loadMonths(){
  try{
    const res = await fetch(DB_URL + '/months.json');
    const data = await res.json();
    months = Array.isArray(data) ? data.filter(Boolean) : [];
  }catch(e){ months = []; }
  if(!months.includes(monthKey(todayISO()))){
    months.push(monthKey(todayISO()));
  }
  months.sort();
  await saveMonths();
}
async function saveMonths(){
  await fetch(DB_URL + '/months.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(months)
  });
}
function renderMonthSelect(){
  monthSelect.innerHTML = '';
  months.slice().reverse().forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = monthLabel(m);
    monthSelect.appendChild(opt);
  });
  monthSelect.value = currentMonth;
}
async function loadEntries(month){
  try{
    const res = await fetch(DB_URL + '/entries/' + month + '.json');
    const data = await res.json();
    entries = data ? Object.values(data) : [];
  }catch(e){ entries = []; }
}
async function saveEntries(){
  const obj = {};
  entries.forEach(e => { obj[e.id] = e; });
  await fetch(DB_URL + '/entries/' + currentMonth + '.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(obj)
  });
}

function render(){
  const sums = {Vorburger:0, Ilic:0};
  entries.forEach(e=>{ sums[e.person] = (sums[e.person]||0) + e.amount; });
  document.getElementById('sumVorburger').textContent = fmt(sums.Vorburger);
  document.getElementById('sumIlic').textContent = fmt(sums.Ilic);

  const diff = sums.Vorburger - sums.Ilic;
  const ausgleichEl = document.getElementById('ausgleich');
  if(Math.abs(diff) < 0.005){
    ausgleichEl.textContent = 'Ausgeglichen';
  }else if(diff > 0){
    ausgleichEl.textContent = 'Ilic schuldet ' + fmt(diff/2);
  }else{
    ausgleichEl.textContent = 'Vorburger schuldet ' + fmt(-diff/2);
  }

  const list = document.getElementById('list');
  list.innerHTML = '';
  if(entries.length === 0){
    list.innerHTML = '<div class="empty">Noch keine Einträge in diesem Monat.</div>';
    return;
  }
  entries.slice().sort((a,b)=> a.date < b.date ? 1 : -1).forEach(e=>{
    const row = document.createElement('div');
    row.className = 'entry';
    const d = new Date(e.date);
    const dstr = d.toLocaleDateString('de-DE');
    row.innerHTML = `
      <div>
        <div class="desc">${escapeHtml(e.desc)}</div>
        <div class="meta">${dstr} · ${e.person}</div>
      </div>
      <div class="amt">${fmt(e.amount)}</div>
      <button class="del" data-id="${e.id}">✕</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      entries = entries.filter(e=>e.id !== btn.dataset.id);
      await saveEntries();
      render();
    });
  });
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

async function init(){
  dateInput.value = todayISO();
  try{
    await loadMonths();
    currentMonth = monthKey(todayISO());
    renderMonthSelect();
    await loadEntries(currentMonth);
    render();
    setStatus(true, 'Verbunden mit Firebase');
  }catch(e){
    setStatus(false, 'Verbindungsfehler: ' + e.message);
  }
}

monthSelect.addEventListener('change', async ()=>{
  currentMonth = monthSelect.value;
  await loadEntries(currentMonth);
  render();
});

document.getElementById('newMonthBtn').addEventListener('click', async ()=>{
  const input = prompt('Neuer Monat (JJJJ-MM), z.B. 2026-08:');
  if(!input) return;
  if(!/^\d{4}-\d{2}$/.test(input)){ alert('Bitte im Format JJJJ-MM eingeben.'); return; }
  if(!months.includes(input)){
    months.push(input);
    months.sort();
    await saveMonths();
    renderMonthSelect();
  }
  currentMonth = input;
  monthSelect.value = input;
  await loadEntries(currentMonth);
  render();
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const desc = document.getElementById('descInput').value.trim();
  const amount = parseFloat(document.getElementById('amountInput').value);
  const person = document.getElementById('personInput').value;
  const date = dateInput.value || todayISO();
  if(!desc || isNaN(amount) || amount <= 0){
    alert('Bitte Beschreibung und einen gültigen Betrag eingeben.');
    return;
  }
  entries.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2), desc, amount, person, date});
  await saveEntries();
  document.getElementById('descInput').value = '';
  document.getElementById('amountInput').value = '';
  render();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('Alle Einträge in ' + monthLabel(currentMonth) + ' wirklich löschen?')) return;
  entries = [];
  await saveEntries();
  render();
});

init();
</script>
</body>
</html>
